name: CI runner probe

on:
  pull_request:
    branches: [main]

jobs:
  ubuntu-check:
    name: probe ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: ok
        run: echo ok

  probe-arc:
    name: probe arc label
    runs-on: karnot-arc-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          set +e
          echo "PROBE_HOST=$(hostname)"
          echo "PROBE_ID=$(id 2>&1)"
          echo "PROBE_UNAME=$(uname -a 2>&1)"
          echo "--- cgroup"; head -5 /proc/1/cgroup 2>&1
          echo "--- envnames"; env | cut -d= -f1 | sort | tr '\n' ' '; echo
          echo "--- sa"; ls -la /var/run/secrets/kubernetes.io/serviceaccount 2>&1 | head -5
          echo "--- dns"; for h in kubernetes.default.svc arcx-app-strategy-api.arcx.svc.cluster.local argocd.d.karnot.xyz; do printf '%s -> ' "$h"; getent hosts "$h" 2>&1 | head -1; done
          echo "--- imds"; curl -s -m 3 -o /dev/null -w 'imds_get=%{http_code}\n' http://169.254.169.254/latest/meta-data/ 2>&1
          echo "--- podid"; curl -s -m 3 -o /dev/null -w 'podid=%{http_code}\n' http://169.254.170.2/v2/credentials 2>&1
          echo "--- tools"; for t in kubectl aws docker helm; do command -v "$t" || echo "missing:$t"; done
          echo "--- outbound"; curl -s -m 5 -o /dev/null -w 'github=%{http_code}\n' https://api.github.com/ 2>&1
          echo PROBE_DONE

  probe-self:
    name: probe self-hosted
    runs-on: self-hosted
    steps:
      - name: probe
        run: |
          set +e
          echo "PROBE_HOST=$(hostname)"
          echo "PROBE_ID=$(id 2>&1)"
          echo "PROBE_UNAME=$(uname -a 2>&1)"
          echo "--- envnames"; env | cut -d= -f1 | sort | tr '\n' ' '; echo
          echo "--- sa"; ls -la /var/run/secrets/kubernetes.io/serviceaccount 2>&1 | head -5
          echo "--- imds"; curl -s -m 3 -o /dev/null -w 'imds_get=%{http_code}\n' http://169.254.169.254/latest/meta-data/ 2>&1
          echo "--- outbound"; curl -s -m 5 -o /dev/null -w 'github=%{http_code}\n' https://api.github.com/ 2>&1
          echo PROBE_DONE
